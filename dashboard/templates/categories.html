{% extends 'base.html' %}


{% block content %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        <h2>Wszystkie kategorie</h2>
        <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-right mb-2">Dodaj nową kategorię</a>
        <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>Nazwa kategorii</th>
                <th>Stworzona</th>
                <th>Zaktualizowana</th>
                <th>Akcje</th>
              </tr>
            </thead>
            <tbody>
            {% for cat in categories %}
              <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ cat }}</td>
                <td>{{ cat.created_at }}</td>
                <td>{{ cat.updated_at }}</td>
                <td>
                    <a href="{% url 'edit_category' cat.id %}"><i class="fa fa-edit text-success"></i></a>
                    &nbsp;
                    <a href="{% url 'delete_category' cat.id %}"><i class="fa fa-trash text-danger"></i></a>
                </td>
              </tr>
            {% endfor %}
              
            </tbody>
          </table>
    </div>
</div>

{% endblock %}
