{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        <h2>Dodaj nowy artykuł</h2>
        <script>
      tinymce.init({
        selector: 'textarea'
      });
    </script>
        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
            {% comment %} enctype służy do przesyłania plików w formularzu {% endcomment %}
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>
    </div>
</div>

{% endblock %}
