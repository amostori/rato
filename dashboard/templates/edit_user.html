{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        {% if perms.auth.add_user %}
        <h2>Edycja użytkownika</h2>
        
        <form action="{% url 'edit_user' user.id %}" method="POST" >
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Zapisz</button>
        </form>
        <br>
        {% else %}
        <h5>Nie masz uprawnień do edycji tego użytkownika</h5>
        {% endif %}
    </div>
</div>

{% endblock %}
